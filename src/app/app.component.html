<igo-spinner igoSpinnerActivity />

@if (authConfig && authConfig.url) {
  <igo-auth-form />
}

@if (header) {
  <app-header [config]="header" [lang]="lang()" />
}

@if (lang() === 'en') {
  <sdg-charter-banner containerClass="igo-charter-banner" />
}

<app-portal igoStopDropPropagation />

@if (hasFooter) {
  <app-footer />
}
