@if (html$ | async) {
  <div class="welcome-window">
    <mat-toolbar color="primary">
      <h1>{{ 'welcomeWindow.title' | translate }}</h1>
      <span class="spacer"></span>
      <mat-checkbox
        id="doNotShowCheck"
        [(ngModel)]="showAgain"
        (change)="setShowAgain()"
      >
        {{ 'welcomeWindow.notShowCheck' | translate }}
      </mat-checkbox>
    </mat-toolbar>
    <div mat-dialog-content class="text">
      <igo-custom-html [html]="html$ | async" />
    </div>
    <mat-dialog-actions align="end">
      <button
        mat-raised-button
        class="button-close"
        color="primary"
        mat-dialog-close
      >
        {{ 'welcomeWindow.closeButton' | translate }}
      </button>
    </mat-dialog-actions>
  </div>
}
